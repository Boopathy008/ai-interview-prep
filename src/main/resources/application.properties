# ============================================================
# AI Interview Preparation System — Application Configuration
# ============================================================

spring.application.name=ai-interview-prep
server.port=${PORT:8080}

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_interview_prep}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1333719559}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA — use 'update' for first run; switch to 'validate' in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Spring AI - GitHub Models (OpenAI-compatible, 100% free)
spring.ai.openai.api-key=${AI_API_KEY}
spring.ai.openai.base-url=https://models.inference.ai.azure.com
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.chat.options.max-tokens=2048

# JWT
app.jwt.secret=${JWT_SECRET:aVeryLongAndSecureSecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong2024AIInterviewPrep}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.interviewprep=DEBUG
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{30} - %msg%n

# App constants
app.name=AI Interview Prep
app.version=1.0.0
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.max-questions-per-test=15
