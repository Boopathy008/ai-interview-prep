<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard – AI Interview Prep</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div id="toastContainer" class="toast-container"></div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="brand-logo"><div class="brand-icon">🛡️</div><div><div class="brand-name">Admin <span>Panel</span></div><span class="brand-sub">AI Interview Prep</span></div></div></div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Admin</div>
      <a class="sidebar-link active" href="/admin"><div class="nav-icon">🛡️</div><span>Admin Dashboard</span></a>
      <div class="nav-section-label">Navigate</div>
      <a class="sidebar-link" href="/dashboard"><div class="nav-icon">📊</div><span>Student View</span></a>
      <a class="sidebar-link" href="/topics"><div class="nav-icon">🚀</div><span>Start Practice</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user"><div class="user-avatar" id="sidebarUserAvatar">A</div><div class="user-info"><div class="user-name" id="sidebarUserName">Admin</div><div class="user-role" id="sidebarUserRole">🛡️ Admin</div></div></div>
      <a class="sidebar-link" href="#" data-action="logout" style="margin-top:4px;"><div class="nav-icon">🚪</div><span>Logout</span></a>
    </div>
  </aside>

  <main class="main-content">
    <div class="top-navbar">
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>
        <div class="page-title">🛡️ Admin Dashboard</div>
      </div>
      <button id="themeToggle" style="background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;"><span id="themeIcon">🌙</span></button>
    </div>

    <div class="page-content">

      <!-- Admin Stats -->
      <div id="adminStats" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:24px;">
        <div class="skeleton" style="height:90px;border-radius:12px;"></div>
        <div class="skeleton" style="height:90px;border-radius:12px;"></div>
        <div class="skeleton" style="height:90px;border-radius:12px;"></div>
        <div class="skeleton" style="height:90px;border-radius:12px;"></div>
      </div>

      <!-- Recent Users -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">👥 Recent Users</div>
          <span class="badge badge-primary" id="totalUsersCount">—</span>
        </div>
        <div class="card-body" id="recentUsersContainer" style="padding:0;">
          <div style="padding:40px;text-align:center;color:var(--text-muted);">Loading...</div>
        </div>
      </div>

    </div>
  </main>
</div>

<script src="/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!Auth.requireAuth()) return;
  if (!Auth.isAdmin()) { window.location.href = '/dashboard'; return; }
  Sidebar.init();

  const res = await API.admin.stats();
  if (!res?.success) return;
  const d = res.data;

  document.getElementById('adminStats').innerHTML = `
    <div class="stat-card" style="color:var(--primary);">
      <div class="stat-icon" style="background:var(--primary-light);">👥</div>
      <div><div class="stat-value">${d.totalStudents || 0}</div><div class="stat-label">Students</div></div>
    </div>
    <div class="stat-card" style="color:#00A87A;">
      <div class="stat-icon" style="background:#E8FBF5;">📝</div>
      <div><div class="stat-value">${d.totalTests || 0}</div><div class="stat-label">Total Tests</div></div>
    </div>
    <div class="stat-card" style="color:#B45309;">
      <div class="stat-icon" style="background:#FFF3E0;">✅</div>
      <div><div class="stat-value">${d.completedTests || 0}</div><div class="stat-label">Completed</div></div>
    </div>
    <div class="stat-card" style="color:#0277BD;">
      <div class="stat-icon" style="background:#E3F7FF;">👤</div>
      <div><div class="stat-value">${d.totalUsers || 0}</div><div class="stat-label">All Users</div></div>
    </div>
  `;

  document.getElementById('totalUsersCount').textContent = `${d.totalUsers} users`;

  const users = d.recentUsers || [];
  document.getElementById('recentUsersContainer').innerHTML = users.length ? `
    <table style="width:100%;border-collapse:collapse;">
      <thead>
        <tr style="border-bottom:1px solid var(--border);background:var(--bg-input);">
          <th style="padding:12px 20px;text-align:left;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;">User</th>
          <th style="padding:12px 16px;text-align:left;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;">Email</th>
          <th style="padding:12px 16px;text-align:center;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;">Tests</th>
          <th style="padding:12px 16px;text-align:center;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;">Avg Score</th>
          <th style="padding:12px 16px;text-align:right;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;">Joined</th>
        </tr>
      </thead>
      <tbody>
        ${users.map(u => `
          <tr style="border-bottom:1px solid var(--border);" onmouseover="this.style.background='var(--bg-input)'" onmouseout="this.style.background=''">
            <td style="padding:14px 20px;">
              <div style="display:flex;align-items:center;gap:10px;">
                <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:14px;flex-shrink:0;">${(u.fullName||u.username||'U')[0].toUpperCase()}</div>
                <div>
                  <div style="font-weight:600;font-size:14px;">${u.fullName || u.username}</div>
                  <div style="font-size:12px;color:var(--text-muted);">@${u.username}</div>
                </div>
              </div>
            </td>
            <td style="padding:14px 16px;font-size:13px;color:var(--text-secondary);">${u.email}</td>
            <td style="padding:14px 16px;text-align:center;font-weight:700;">${u.totalTests || 0}</td>
            <td style="padding:14px 16px;text-align:center;font-weight:700;color:${(u.averageScore||0)>=60?'var(--secondary)':'var(--accent)'};">${u.averageScore ? Math.round(u.averageScore) + '%' : '—'}</td>
            <td style="padding:14px 16px;text-align:right;font-size:12px;color:var(--text-muted);">${formatDate(u.createdAt)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  ` : '<div style="padding:40px;text-align:center;color:var(--text-muted);">No users found</div>';
});
</script>
</body>
</html>
