name: Keep Render App Alive

on:
  schedule:
    # Runs every 14 minutes (Render sleeps after 15 mins of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive-render
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Application
        run: |
          curl -s --max-time 15 https://ai-interview-prep-38xp.onrender.com > /dev/null || true

